- id: "1000000000001"
  alias: Turn on the entrance light at sunset
  triggers:
    - trigger: sun
      event: sunset
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.entrance_light
- id: "1000000000002"
  alias: Turn everything off at night
  triggers:
    - trigger: time
      at: "23:30:00"
  actions:
    - action: script.turn_off_everything
