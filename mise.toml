[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
node = "24.22.3"

[tasks.build]
description = "Build hcs into bin/ (embeds the web UI if it was built)"
run = "go build -o bin/hcs ./cmd/hcs"

[tasks."ui:install"]
description = "Install the web UI dependencies (exact versions from ui/package-lock.json)"
dir = "ui"
run = "npm ci --no-audit --no-fund"

[tasks."ui:build"]
description = "Build the web UI into internal/webui/dist (embedded by go build)"
dir = "ui"
depends = ["ui:install"]
run = "npm run build"

[tasks."ui:dev"]
description = "Serve the web UI with hot reload, proxying /api to a local hcs serve on :8099"
dir = "ui"
run = "npm run dev"

[tasks.test]
description = "Tests with the race detector"
run = "go test -race ./..."

[tasks.lint]
description = "go vet + golangci-lint"
run = ["go vet ./...", "golangci-lint run"]

[tasks.fuzz]
description = "Fuzz the parsers and matchers (outside the normal cycle)"
run = "go test ./internal/paths -run '^$' -fuzz FuzzClassifyRepoPath -fuzztime 60s"

[tasks."test:ha-core"]
description = "HA client against a real Core in Docker (scripts/ha-core-test.sh)"
run = "scripts/ha-core-test.sh"

[tasks."test:e2e"]
description = "E2E on the synthetic config in testdata/ with the real check_config in Docker (E2E_CHECKER=noop without Docker)"
run = "scripts/e2e-sandbox.sh"

[tasks."supervisor:up"]
description = "Real Supervisor in Docker (add-on devcontainer) with the local app mounted"
run = "scripts/supervisor-dev.sh up"

[tasks."supervisor:down"]
description = "Remove the test Supervisor and its volumes"
run = "scripts/supervisor-dev.sh down"

[tasks."test:supervisor"]
description = "Build, options, startup and a full app cycle on the test Supervisor"
run = "scripts/supervisor-test.sh"

[tasks.check]
description = "What must pass before every commit"
depends = ["lint", "test", "build"]
