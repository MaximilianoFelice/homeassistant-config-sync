[tools]
go = "1.27.4"
golangci-lint = "2.15.0"

[tasks.build]
description = "Compila hcs en bin/"
run = "go build -o bin/hcs ./cmd/hcs"

[tasks.test]
description = "Tests con el race detector"
run = "go test -race ./..."

[tasks.lint]
description = "go vet + golangci-lint"
run = ["go vet ./...", "golangci-lint run"]

[tasks.fuzz]
description = "Fuzzing de los parsers y matchers (fuera del ciclo normal)"
run = "go test ./internal/paths -run '^$' -fuzz FuzzClassifyRepoPath -fuzztime 60s"

[tasks."test:ha-core"]
description = "Cliente de HA contra un Core real en Docker (scripts/ha-core-test.sh)"
run = "scripts/ha-core-test.sh"

[tasks."test:e2e"]
description = "E2E sobre la config sintética de testdata/ con check_config real en Docker (E2E_CHECKER=noop sin Docker)"
run = "scripts/e2e-sandbox.sh"

[tasks."supervisor:up"]
description = "Supervisor real en Docker (devcontainer de add-ons) con la app local montada"
run = "scripts/supervisor-dev.sh up"

[tasks."supervisor:down"]
description = "Borra el Supervisor de prueba y sus volúmenes"
run = "scripts/supervisor-dev.sh down"

[tasks."test:supervisor"]
description = "Build, opciones, arranque y ciclo completo de la app en el Supervisor de prueba"
run = "scripts/supervisor-test.sh"

[tasks.check]
description = "Lo que tiene que pasar antes de cada commit"
depends = ["lint", "test", "build"]
