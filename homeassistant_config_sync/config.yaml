name: Git Config Sync
version: "0.1.1"
slug: homeassistant_config_sync
description: Two-way sync of your Home Assistant folders with a git repo, using plain git
url: https://github.com/MaximilianoFelice/homeassistant-config-sync
# Prebuilt images published by the release workflow. For a local build
# (scripts/supervisor-dev.sh), scripts/build-addon.sh --stage drops this line.
image: ghcr.io/maximilianofelice/{arch}-homeassistant-config-sync
arch:
  - aarch64
  - amd64
# all_app_configs and local_apps need Supervisor 2026.11, which ships with
# Core 2026.11.
homeassistant: "2026.11.0"
startup: application
boot: auto
homeassistant_api: true
# Only for Supervisor discovery (announcing the app to the config_sync
# integration); the default role, no manager permissions.
hassio_api: true
discovery:
  - config_sync
ingress: true
ingress_port: 8099
panel_icon: mdi:source-branch-sync
panel_title: Git Config Sync
# The same folders as the official Terminal & SSH app. What is synced is
# decided by the repo's .gitignore.
map:
  - type: homeassistant_config
    read_only: false
  - type: all_app_configs
    read_only: false
  - type: share
    read_only: false
  - type: ssl
    read_only: false
  - type: media
    read_only: false
  - type: backup
    read_only: false
  - type: local_apps
    read_only: false
options:
  repository: ""
  token: ""
  main_branch: main
  box_branch: box
  root: /
  sync_interval_minutes: 5
  merge_options: []
  check_config: true
  reload: true
  max_file_size_mb: 10
  delete_guard_files: 25
  delete_guard_percent: 20
  commit_author: "Home Assistant <ha@box.local>"
  secret_scan:
    mode: warn
schema:
  repository: str
  token: password
  username: str?
  main_branch: str
  box_branch: str
  root: str
  sync_interval_minutes: int(0,)
  merge_options:
    - str
  check_config: bool
  reload: bool
  max_file_size_mb: int(1,)
  delete_guard_files: int(1,)
  delete_guard_percent: int(1,100)
  commit_author: str
  notify_service: str?
  secret_scan:
    mode: list(warn|block|off)
