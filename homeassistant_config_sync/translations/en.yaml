configuration:
  repository:
    name: Repository
    description: >-
      SSH URL of the git repository, e.g. git@github.com:you/ha-config.git.
      Add the app's deploy key (shown in the panel and in the log) to the
      repository with write access. HTTPS URLs and tokens are not accepted.
  main_branch:
    name: Main branch
    description: Branch humans work on. Changes pushed here are applied to Home Assistant.
  box_branch:
    name: Box branch
    description: Branch that mirrors this Home Assistant. Only the app writes to it.
  mode:
    name: Mode
    description: >-
      bidirectional (default) syncs both ways; push_only only publishes the box
      branch and never applies main; pull_only makes this Home Assistant follow
      main and discards its local edits (they stay in the box branch history).
  sync_interval_minutes:
    name: Sync interval (minutes)
    description: How often to sync. 0 = only when triggered by hand.
  reload:
    name: Reload
    description: auto reloads the YAML configuration after applying a change; none never reloads.
  restart:
    name: Restart
    description: >-
      never (default) only recommends a restart when a change needs one; auto
      restarts Home Assistant after applying such a change.
  check_warnings:
    name: Config check warnings
    description: >-
      Home Assistant reports an integration with an invalid config as a warning
      (it starts without that integration). new (default) rejects changes that
      add warnings; any rejects any warning; ignore only looks at errors.
  commit_author:
    name: Commit author
    description: Author of the commits made from this box, as "Name <email>".
  max_file_size_kb:
    name: Max file size (KB)
    description: Larger files are skipped and reported.
  delete_guard_percent:
    name: Mass-deletion guard (%)
    description: Stop when a snapshot would delete at least 5 files and more than this share of the managed files.
  delete_guard_files:
    name: Mass-deletion guard (files)
    description: Stop when a snapshot would delete more than this many managed files.
  notify_service:
    name: Notify service
    description: Optional, e.g. notify.mobile_app_my_phone, to also get the problems that need you.
  ssh_known_hosts:
    name: Extra SSH known hosts
    description: Host key lines for a git server other than GitHub (whose keys are built in).
  mappings:
    name: Mappings
    description: >-
      Which repo folder maps to which directory, and which files are synced
      (include), only uploaded (push_only) or left out (exclude). Secrets,
      databases, logs and keys are never synced, whatever these say.
  secret_scan:
    name: Secret scanner
    description: >-
      webhook_id: warn or block literal webhook ids. allow: fingerprints of
      findings that are false positives.
network:
  8099/tcp: Web UI and API (used through ingress; no need to expose it).
