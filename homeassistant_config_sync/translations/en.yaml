configuration:
  repository:
    name: Repository
    description: >-
      HTTPS URL of the git repository, e.g. https://github.com/you/home.git.
      Any git host works: GitHub, GitLab, Gitea…
  token:
    name: Access token
    description: >-
      A token with read and write access to the repository's contents, e.g. a
      GitHub fine-grained token limited to that repository. It is stored in
      this app's options (and therefore in Home Assistant backups).
  username:
    name: Username
    description: Optional. Only for hosts that need a username with the token.
  main_branch:
    name: Main branch
    description: Branch people work on. Changes pushed here are applied to this box.
  box_branch:
    name: Box branch
    description: Branch that mirrors this box. Only the app writes to it.
  root:
    name: Root
    description: >-
      Folder synced. / (default) syncs every folder the app sees
      (homeassistant, app_configs, share, ssl, media, backup, local_apps);
      /homeassistant (or config) syncs only Home Assistant's configuration.
      What is synced inside it is decided by the repo's .gitignore.
  sync_interval_minutes:
    name: Sync interval (minutes)
    description: How often to sync. 0 = only when triggered by hand.
  merge_options:
    name: Merge options
    description: >-
      Passed to git as -X<option> when the box and main changed the same
      file, e.g. ours (the box wins), theirs (main wins), patience. Per-file
      rules go in the repo's .gitattributes.
  check_config:
    name: Check Home Assistant's config
    description: After applying a change to Home Assistant's configuration, run its config check and report the result. Nothing is ever rolled back.
  reload:
    name: Reload Home Assistant
    description: After applying a change to Home Assistant's configuration, reload it (skipped if the check reported errors).
  max_file_size_mb:
    name: Max file size (MB)
    description: A larger file stops the sync until it is added to .gitignore or this limit is raised.
  delete_guard_files:
    name: Mass-deletion guard (files)
    description: Stop when a sync would delete more than this many files.
  delete_guard_percent:
    name: Mass-deletion guard (%)
    description: Stop when a sync would delete at least 5 files and more than this share of them.
  commit_author:
    name: Commit author
    description: Author of the commits made from this box, as "Name <email>".
  notify_service:
    name: Notify service
    description: Optional, e.g. notify.mobile_app_my_phone, to also get the problems that need you.
  secret_scan:
    name: Secret scanner
    description: >-
      mode: warn (default) reports possible secrets and syncs anyway; block
      stops the sync; off turns the scanner off. Rules and ignores come from
      the repo's .gitleaks.toml and .gitleaksignore.
network:
  8099/tcp: Web UI and API (used through ingress; no need to expose it).
